name: Rust port tests

on:
  push:
    branches:
      - go-rust

jobs:
  rust_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test HW01 Rust port
        run: cargo test
        working-directory: hw01_hello_otus/rust